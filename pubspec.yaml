name: sint_sentinel
description: "Circuit Breaker, Rate Limiter & Snapshot Auditor for Flutter. Protects against excessive API calls, infinite rebuild loops, and cascading failures."
version: 1.1.0
repository: https://github.com/Open-Neom/sint_sentinel
topics:
  - circuit-breaker
  - rate-limiter
  - state-management
  - firebase
  - resilience

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  sint: ^1.3.0
  hive_flutter: ^1.1.0
  logger: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
