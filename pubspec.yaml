name: sint_sentinel
description: Circuit Breaker & Rate Limiter for the SINT framework.
  Protects Flutter apps against excessive API calls, DoS, infinite rebuild loops,
  and cascading failures with zero-config defaults.
version: 1.0.0
homepage: https://github.com/Open-Neom/sint_sentinel
repository: https://github.com/Open-Neom/sint_sentinel
issue_tracker: https://github.com/Open-Neom/sint_sentinel/issues
topics:
  - circuit-breaker
  - rate-limiter
  - state-management
  - firebase
  - resilience

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  sint: ^1.3.0
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
